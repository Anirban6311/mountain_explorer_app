name: basic_crud_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Firebase / backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.2
  # Networking + env
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2
  # State management / routing / DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.2.0
  # UI primitives still in use
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  intl: ^0.19.0
  # Maps + offline tiles (used from Iteration 2)
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.3
  latlong2: ^0.9.1
  # Location + platform sensors
  geolocator: ^13.0.2
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.5
  # Local DB
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Emergency + notifications (used from Iteration 4/5)
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3
  # Region id generation (offline maps Iteration 2+)
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3
  fake_cloud_firestore: ^3.0.3

dependency_overrides:
  archive: ^3.6.1
  win32: ^5.5.4
  flutter_plugin_android_lifecycle: ^2.0.34
  image_picker_android: ^0.8.12+20
  path_provider_android: '>=2.2.5 <2.2.16'

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/Images/
    - assets/Images/Mountain_images/
    - assets/Icons/
    - .env
